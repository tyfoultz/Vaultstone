# Supabase local dev config — generated by `supabase init`.
# Replace project_id once the Supabase project is created.

[api]
port = 54321

[db]
port = 54322

[studio]
port = 54323

[inbucket]
port = 54324

[auth]
site_url = "http://localhost:8081"
additional_redirect_urls = ["https://localhost:8081"]
jwt_expiry = 3600
enable_signup = true

# ai-chat verifies the caller's JWT inside the function (so it can also read the
# user identity for campaign authorization). Keep platform-level verification on.
[functions.ai-chat]
verify_jwt = true
